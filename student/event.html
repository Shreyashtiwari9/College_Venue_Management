<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Events | Campus Venue Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/event.css">

    <style>

        .events-loading,
        .events-error {
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            margin: 20px 0;
        }

        .events-loading {
            background: #f5f7fa;
            color: #555;
        }

        .events-error {
            background: #fff1f1;
            color: #c62828;
            border: 1px solid #ffcdd2;
            display: none;
        }

        .event-status.approved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .event-status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .event-status.rejected {
            background: #f8d7da;
            color: #842029;
        }

        .event-status.cancelled {
            background: #e2e3e5;
            color: #41464b;
        }

    </style>

    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/api-config.js"></script>
</head>


<body class="event-page">


<div class="events-page">





    <div class="events-header">

        <div>

            <h1>
                College Events
            </h1>

            <p>
                Explore upcoming events, competitions,
                workshops and activities.
            </p>

        </div>


        <div class="event-header-icon">

            <i class="bi bi-calendar-event"></i>

        </div>

    </div>






    <div class="filter-box">


        <div class="search-wrapper">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="eventSearch"
                placeholder="Search events..."
            >

        </div>






        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

            <option value="technical">
                Technical
            </option>

            <option value="cultural">
                Cultural
            </option>

            <option value="sports">
                Sports
            </option>

            <option value="workshop">
                Workshop
            </option>

            <option value="seminar">
                Seminar
            </option>

            <option value="other">
                Other
            </option>

        </select>



        <select id="dateFilter">

            <option value="all">
                All Dates
            </option>

            <option value="today">
                Today
            </option>

            <option value="week">
                This Week
            </option>

            <option value="month">
                This Month
            </option>

        </select>



        <button
            class="reset-btn"
            id="resetBtn"
            type="button"
        >

            <i class="bi bi-arrow-clockwise"></i>

            Reset

        </button>

    </div>






    <div class="event-count">

        Showing
        <span id="eventCount">--</span>
        events

    </div>






    <div
        id="eventsLoading"
        class="events-loading"
    >

        <i class="bi bi-hourglass-split"></i>

        Loading events...

    </div>






    <div
        id="eventsError"
        class="events-error"
    ></div>






    <div
        class="events-grid"
        id="eventsGrid"
    ></div>






    <div
        class="no-events"
        id="noEvents"
        style="display:none;"
    >

        <i class="bi bi-calendar-x"></i>

        <h3>
            No Events Found
        </h3>

        <p>
            Try changing your search or filter options.
        </p>

    </div>


</div>






<div
    class="toast-message"
    id="toast"
></div>



<script src="../js/events.js"></script>

<script src="../js/auth.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        protectPage("student");

    }
);

</script>


</body>

</html>
