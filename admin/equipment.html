<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipment Management | CampusVenue</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin-equipment.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/api-config.js"></script>
</head>

<body class="role-page">

<header class="topbar">
    <div class="container">
        <nav class="navbar">

            <a href="../index.html" class="logo">
                Campus<span>Venue</span>
            </a>

            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="users.html">Users</a>
                <a href="venues.html">Venues</a>
                <a href="events.html">Events</a>
                <a href="approvals.html">Approvals</a>
                <a href="equipment.html" class="active">Equipment</a>
                <a href="reports.html">Reports</a>
            </div>

            <button onclick="logout()" class="btn btn-outline">
                Logout
            </button>

        </nav>
    </div>
</header>


<main class="container section">

    <div class="page-header">
        <h1>Equipment Management</h1>
        <p>
            Track projectors, microphones, speakers, laptops and other resources.
        </p>
    </div>


    <div class="equipment-box">

        <div class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Search equipment..."
            >

            <select id="status">
                <option value="">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="Returned">Returned</option>
            </select>

            <button
                onclick="addEquipment()"
                class="btn btn-primary">
                Refresh Requests
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Equipment</th>
                        <th>Quantity</th>
                        <th>Event</th>
                        <th>Organizer</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>


                <tbody id="equipmentTable">
                    <tr>
                        <td colspan="6">Loading equipment requests...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</main>




<script src="../js/auth.js"></script>
<script src="../js/admin-equipment.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    protectPage("admin");
});
</script>
</body>
</html>
