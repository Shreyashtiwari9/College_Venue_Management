<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Volunteers | CampusVenue</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../css/volunteers.css"
    >

    <link rel="stylesheet" href="../css/organizer-dashboard.css">

    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/api-config.js"></script>
</head>


<body class="role-page">


<header class="topbar organizer-topbar">

    <div class="container">

        <nav class="navbar">


            <button
                type="button"
                class="organizer-menu-toggle"
                id="organizerMenuToggle"
                aria-controls="organizerNavLinks"
                aria-expanded="false"
                aria-label="Open navigation menu">
                <span aria-hidden="true">&#9776;</span>
            </button>

            <a
                href="../index.html"
                class="logo"
            >
                Campus<span>Venue</span>
            </a>


            <div class="nav-links" id="organizerNavLinks">


                <a href="dashboard.html">
                    Dashboard
                </a>


                <a href="create-event.html">
                    Create Event
                </a>


                <a href="my-events.html">
                    My Events
                </a>


                <a href="venue-request.html">
                    Venue Request
                </a>


                <a href="schedule.html">
                    Schedule
                </a>


                <a
                    href="volunteers.html"
                    class="active"
                >
                    Volunteers
                </a>


                <a href="equipment.html">
                    Equipment
                </a>


                <a href="attendance.html">
                    Attendance
                </a>

                <a href="notifications.html" class="notification-link">
                    <span aria-hidden="true">&#128276;</span>
                    <span id="notificationCount" class="notification-badge">0</span>
                </a>

            </div>


            <button
                class="btn btn-outline"
                onclick="logout()"
                type="button"
            >
                Logout
            </button>


        </nav>

    </div>

</header>



<main class="container section">


    <div class="page-header">

        <h1>
            Volunteer Management
        </h1>

        <p>
            Manage volunteers and assign
            responsibilities for your events.
        </p>

    </div>



    <div class="toolbar">


        <input
            id="search"
            type="search"
            placeholder="Search volunteer..."
            oninput="filterVolunteers()"
            autocomplete="off"
        >


        <select
            id="role"
            onchange="filterVolunteers()"
        >

            <option value="">
                All Roles
            </option>

            <option value="registration">
                Registration
            </option>

            <option value="technical support">
                Technical Support
            </option>

            <option value="stage management">
                Stage Management
            </option>

            <option value="hospitality">
                Hospitality
            </option>

            <option value="security">
                Security
            </option>

        </select>


        <button
            class="btn btn-primary"
            onclick="addVolunteer()"
            type="button"
        >
            + Add Volunteer
        </button>


    </div>



    <div
        class="volunteer-grid"
        id="volunteers"
    >

        <div class="card volunteer-loading-card">

            <p>
                Loading volunteers...
            </p>

        </div>

    </div>


</main>



<script src="../js/auth.js"></script>
<script src="../js/organizer-menu.js"></script>
<script src="../js/volunteers.js"></script>
<script src="../js/organizer-notification.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        protectPage("organizer");

    }
);

</script>


</body>

</html>
